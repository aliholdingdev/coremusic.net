<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NovaSearch</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --border: #2d333b; --text: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --gold: #e3b341; --green: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h1 span { color: var(--accent); }
  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=search] { flex: 1 1 320px; padding: 10px 12px; font-size: 15px;
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  select, input[type=number] { padding: 9px 10px; background: var(--panel);
    color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
  button { padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #04121f; border: 0; border-radius: 8px; }
  button:disabled { opacity: .5; cursor: wait; }
  .opts { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 4px;
    color: var(--dim); font-size: 13px; align-items: center; }
  .opts label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .progress { height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; margin: 14px 0; display: none; }
  .progress.on { display: block; }
  .progress i { display: block; height: 100%; width: 30%; background: var(--accent);
    animation: slide 1s linear infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .meta { color: var(--dim); font-size: 13px; margin: 10px 0; }
  .meta b { color: var(--gold); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.url { max-width: 330px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.id { font-family: Consolas, monospace; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .badge { display: inline-block; min-width: 34px; text-align: center; padding: 1px 7px;
    border-radius: 10px; font-size: 12px; font-weight: 700;
    background: #1f2d1f; color: var(--green); border: 1px solid #2ea04333; }
  .badge.det { background: #21262d; color: var(--dim); border-color: var(--border); }
  .reason { color: var(--dim); font-size: 13px; margin-top: 3px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: var(--dim); padding: 24px 0; }
  .err { color: #f85149; }
  button.dbtn { padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--accent); border: 1px solid var(--border);
    border-radius: 6px; white-space: nowrap; }
  button.dbtn:hover { border-color: var(--accent); }
  /* Detay modal */
  .modal { position: fixed; inset: 0; display: none; z-index: 50;
    background: rgba(1,4,9,.72); padding: 24px 12px; overflow: auto; }
  .modal.on { display: block; }
  .modal .panel { max-width: 980px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .modal .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .modal h2 { font-size: 16px; margin: 0 0 4px; }
  .modal h3 { font-size: 13px; margin: 18px 0 6px; color: var(--gold);
    text-transform: uppercase; letter-spacing: .05em; }
  .modal .mmeta { color: var(--dim); font-size: 13px; }
  .modal .close { padding: 4px 10px; font-size: 13px; background: transparent;
    color: var(--dim); border: 1px solid var(--border); border-radius: 6px; }
  .modal .close:hover { color: var(--text); border-color: var(--accent); }
  .modal .cmt { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .cmt .who { color: var(--dim); font-size: 12px; }
  .modal .rel { display: flex; gap: 10px; align-items: baseline; padding: 7px 0;
    border-bottom: 1px solid var(--border); font-size: 14px; }
  .rel .rmeta { color: var(--dim); font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Nova<span>Search</span> — YouTube metadata arama</h1>

  <form id="f">
    <input type="search" id="q" placeholder="Sorgu… (örn: tarkan kuzu kuzu)" autofocus />
    <select id="limit" title="Sonuç limiti">
      <option>12</option><option selected>24</option><option>50</option><option>100</option>
      <option>500</option><option>1000</option><option>5000</option>
    </select>
    <select id="sortBy" title="Sıralama">
      <option value="">ilgi</option><option value="views">izlenme</option>
      <option value="date">tarih</option><option value="rating">puan</option>
    </select>
    <select id="filter" title="Tür">
      <option value="">tümü</option><option value="v">video</option>
      <option value="s">şarkı</option><option value="sh">short</option>
    </select>
    <button id="go" type="submit">Ara</button>
  </form>

  <div class="opts">
    <label><input type="checkbox" id="ai" checked /> AI skor</label>
    <label><input type="checkbox" id="deep" /> deep</label>
    <label title="Tüm sonuç sayfalarını otomatik kaydırıp topla (devam edebilir — uzun sürebilir)"><input type="checkbox" id="scrollAll" /> tüm sayfalar (scroll)</label>
    <label><input type="checkbox" id="explain" checked /> açıklama</label>
    <label><input type="checkbox" id="offline" /> offline</label>
    <label>min izlenme <input type="number" id="minViews" placeholder="0" style="width:90px" /></label>
    <input type="text" id="aiPrompt" placeholder="AI prompt (opsiyonel — AI'ya gider)…"
      title="Skorlama ve analizde AI'ya iletilecek özel talimat"
      style="flex:1 1 260px;min-width:220px;padding:6px 10px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px" />
  </div>

  <div class="progress" id="prog"><i></i></div>
  <div class="meta" id="meta"></div>
  <div id="out"></div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="panel" id="mpanel"></div>
</div>

<script>
const API = location.protocol + '//' + location.hostname + ':3100/api/v1';
const $ = (id) => document.getElementById(id);

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (window.__busy) return; // çift Enter/yarış kilidi
  const q = $('q').value.trim();
  if (!q) return;

  window.__busy = true;
  $('go').disabled = true;
  $('prog').classList.add('on');
  $('meta').textContent = '';
  $('out').innerHTML = '';
  const t0 = performance.now();

  try {
    const p = new URLSearchParams({ q, limit: $('limit').value });
    if ($('sortBy').value) p.set('sort', $('sortBy').value);
    if ($('filter').value) p.set('filter', $('filter').value);
    if ($('ai').checked) p.set('ai', '1');
    if ($('deep').checked) p.set('deep', '1');
    if ($('scrollAll').checked) p.set('scroll', 'all'); // tüm sayfaları otomatik kaydır
    if ($('explain').checked) p.set('explain', '1');
    if ($('offline').checked) p.set('offline', '1');
    const mv = Number($('minViews').value);
    if (mv > 0) p.set('minViews', String(mv));
    const ap = $('aiPrompt').value.trim();
    if (ap) p.set('prompt', ap);

    const r = await fetch(API + '/search?' + p.toString());
    const body = await r.json();
    if (!body.ok) throw new Error(body.error?.message ?? 'API hatası');

    const ms = Math.round(performance.now() - t0);
    render(body.data, body.meta, ms);
  } catch (err) {
    $('out').innerHTML = '<div class="empty err">Hata: ' + esc(String(err.message || err)) +
      ' — API çalışıyorsa <code>nova serve</code> açık olmalı (3100).</div>';
  } finally {
    window.__busy = false;
    $('go').disabled = false;
    $('prog').classList.remove('on');
  }
});

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function views(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + ' Mr';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + ' M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + ' B';
  return String(n ?? 0);
}
function dur(s) {
  if (!s) return '--:--';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const p = (v) => String(v).padStart(2, '0');
  return h ? h + ':' + p(m) + ':' + p(x) : m + ':' + p(x);
}

function render(rows, meta, ms) {
  const bits = ['<b>' + rows.length + '</b> sonuç', 'kaynak: ' + esc(meta.source),
    (meta.tookMs ?? ms) + ' ms'];
  if (meta.aiEnabled) bits.push('AI açık');
  if (meta.aiPromptApplied) bits.push('AI prompt ✓');
  if (meta.offline) bits.push('OFFLINE');
  if (meta.scroll === -1) bits.push('scroll: tüm sayfalar');
  else if (meta.scroll > 1) bits.push('scroll: ' + meta.scroll + ' sayfa');
  if (meta.dbVideos != null) bits.push('DB: ' + meta.dbVideos);
  if (meta.expandedQueries?.length) bits.push('deep: ' + esc(meta.expandedQueries.join(' · ')));
  $('meta').innerHTML = bits.join(' · ');

  if (!rows.length) {
    $('out').innerHTML = '<div class="empty">Sonuç yok — offline’ı kaldırın veya <code>nova collect</code> çalıştırın.</div>';
    return;
  }

  const head = '<tr><th>#</th><th>Başlık</th><th>Kanal</th><th>Süre</th><th>İzlenme</th><th>Skor</th>' +
    '<th>Video ID</th><th>URL</th><th></th></tr>';
  const body = rows.map((r, i) => {
    const score = r.aiScore != null
      ? '<span class="badge">' + r.aiScore + '</span>'
      : '<span class="badge det">' + r.score + '</span>';
    const reason = r.aiReason ? '<div class="reason">› ' + esc(r.aiReason) + '</div>' : '';
    const url = r.url || ('https://www.youtube.com/watch?v=' + r.youtubeId);
    return '<tr>' +
      '<td class="num">' + (i + 1) + '</td>' +
      '<td><a href="' + esc(url) + '" target="_blank" rel="noopener">' +
        esc(r.title) + '</a>' + reason + '</td>' +
      '<td>' + esc(r.channelName || '—') + '</td>' +
      '<td class="num">' + dur(r.durationSec) + '</td>' +
      '<td class="num">' + views(r.viewCount) + '</td>' +
      '<td class="num">' + score + '</td>' +
      '<td class="id">' + esc(r.youtubeId) + '</td>' +
      '<td class="url"><a href="' + esc(url) + '" target="_blank" rel="noopener" title="' + esc(url) + '">' + esc(url) + '</a></td>' +
      '<td><button class="dbtn" data-id="' + esc(r.youtubeId) + '">Detay</button></td></tr>';
  }).join('');

  $('out').innerHTML = '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}

/* ---- Detay modalı: video + yorumlar (10) + benzer videolar (10, AI skorlu) ---- */
$('out').addEventListener('click', (e) => {
  const b = e.target.closest('.dbtn');
  if (b) openDetail(b.dataset.id);
});
$('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal' || e.target.closest('.close')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function closeModal() {
  $('modal').classList.remove('on');
  $('modal').setAttribute('aria-hidden', 'true');
}

async function openDetail(id) {
  const panel = $('mpanel');
  $('modal').classList.add('on');
  $('modal').setAttribute('aria-hidden', 'false');
  panel.innerHTML = '<div class="empty">Yükleniyor…</div>';
  try {
    const r = await fetch(API + '/videos/' + encodeURIComponent(id) + '?comments=10&related=10&ai=1');
    const body = await r.json();
    if (!body.ok) throw new Error(body.error?.message ?? 'API hatası');
    panel.innerHTML = renderDetail(body.data);
  } catch (err) {
    panel.innerHTML = '<div class="empty err">Hata: ' + esc(String(err.message || err)) + '</div>';
  }
}

function renderDetail(d) {
  const m = d.meta;
  let h = '<div class="head"><div>';
  if (d.video) {
    const v = d.video;
    h += '<h2><a href="' + esc(v.url) + '" target="_blank" rel="noopener">' + esc(v.title) + '</a></h2>';
    h += '<div class="mmeta">' + esc(v.channelName || 'kanal ?') + ' · ' + dur(v.durationSec) +
      ' · ' + views(v.viewCount) + ' izlenme' + (v.isShort ? ' · <b>SHORT</b>' : '') + '</div>';
  } else {
    h += '<h2>Video kaydı yok: ' + esc(m.videoId) + '</h2>';
  }
  h += '</div><button class="close" title="Kapat (Esc)">✕</button></div>';

  const bits = ['kaynak: ' + esc(m.source), m.commentsCount + ' yorum', m.relatedCount + ' benzer',
    m.aiScored ? 'AI skorlu: ' + m.aiScored : '', m.tookMs + ' ms'];
  if (m.commentsFromCache) bits.push('yorum cache');
  if (m.relatedFromCache) bits.push('benzer cache');
  if (m.offline) bits.push('OFFLINE');
  if (m.degraded) bits.push('DEGRADED (YouTube erişilemedi → boş bölüm)');
  h += '<div class="mmeta">' + bits.join(' · ') + '</div>';

  h += '<h3>Yorumlar (' + d.comments.length + ')</h3>';
  h += d.comments.length
    ? d.comments.map((c) =>
        '<div class="cmt">' + esc(c.text) +
        '<div class="who">' + esc(c.authorName) + (c.isChannelOwner ? ' ✓' : '') +
        (c.isPinned ? ' · 📌' : '') + ' · ' + esc(c.publishedText ?? '') +
        ' · ' + views(c.likeCount) + ' beğeni</div></div>').join('')
    : '<div class="empty">Yorum yok (offline · veya YouTube erişilemedi).</div>';

  h += '<h3>Benzer videolar (' + d.related.length + ')</h3>';
  h += d.related.length
    ? d.related.map((r) =>
        '<div class="rel"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        (r.contentType === 'SHORT' ? '⚡ ' : '') + esc(r.title) + '</a>' +
        '<span class="rmeta">' + esc(r.channelName || '—') + ' · ' + views(r.viewCount) +
        (r.publishedText ? ' · ' + esc(r.publishedText) : '') +
        (r.aiScore != null ? ' · <span class="badge">AI ' + r.aiScore + '</span>' : '') +
        '</span></div>' +
        (r.aiReason ? '<div class="reason">› ' + esc(r.aiReason) + '</div>' : '')).join('')
    : '<div class="empty">Benzer video yok (offline · veya YouTube erişilemedi).</div>';

  return h;
}
</script>
</body>
</html>
