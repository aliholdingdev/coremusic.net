  # ─── F8: ses/video stream (contract-first kayıt) ───
  # Gerçek istek index.php §1.1 byte-path'inde (`#^(?:/api/v1)?/stream/([a-f0-9]{32})$#`)
  # GATEWAY'DEN ÖNCE yakalanır: RateLimit (SEC-01 ip bucket) → Authentication
  # (session cookie veya RS256 Bearer + jti revocation) → StreamController.
  # RouteTable exact-match olduğu için gerçek 32-hex id bu satıra düşmez; kayıt
  # sözleşmenin tek noktadan ilanıdır.
  /api/v1/stream/{id}:
    get:
      summary: Stream media file (audio/video)
      description: >
        RFC 9110 Range destekli byte akışı. Giriş zorunlu (fail-closed): kimliksiz
        istek 401 döner. `If-None-Match` eşleşirse 304, `Range` ise 206 üretir.
        Hata gövdesi `{error:{code,message}}` sözleşmesindedir.
      operationId: stream
      parameters:
        - name: id
          in: path
          required: true
          description: 32 karakter hex müzik ID (UUIDv7)
          schema:
            type: string
            pattern: '^[a-f0-9]{32}$'
      responses:
        '200':
          description: Full media body
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range)
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (If-None-Match eşleşti)
        '400':
          description: 'STREAM_ID_INVALID — geçersiz ID biçimi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (stream girişe zorunlu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'STREAM_FORBIDDEN — path traversal / link reddi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'STREAM_NOT_FOUND / STREAM_PATH_INVALID / STREAM_FILE_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: Range not satisfiable
          headers:
            Content-Range:
              schema:
                type: string
        '429':
          description: Rate limited (SEC-01 — /stream de rate-limit'ten geçer)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'STREAM_READ_ERROR / STREAM_SEEK_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen:
        handler: StreamController::stream

  # ─── Billing: abonelik/plan özeti + faturalar (own-data, auth zorunlu) ───
  # Zarf: framework {data,meta} (ApiResponse::ok / ApiResponse::paginated);
  # hatalar {error:{code,message[,fields]}} — UNAUTHORIZED 401 ·
  # VALIDATION_ERROR 422 · NOT_FOUND 404. Ödeme/PSP yazma ucu YOK (kapsam dışı).
  /api/v1/billing/plan:
    get:
      summary: Current subscription and plan summary
      description: >
        Kimliği doğrulanmış kullanıcının KENDİ abonelik/plan özeti. Abonelik
        yoksa `has_subscription:false` + `subscription:null` + `plan:null`
        döner (uydurma plan yok). Salt okuma — ödeme işlemi yoktur.
      operationId: billingPlan
      responses:
        '200':
          description: Plan summary (abonelik yoksa null alanlar)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlanResponse'
        '401':
          description: Unauthorized (auth'sız istek)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'NOT_FOUND — bilinmeyen action'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen:
        handler: BillingController::plan

  /api/v1/billing/invoices:
    get:
      summary: Own invoices (paginated)
      description: >
        Kimliği doğrulanmış kullanıcının KENDİ faturaları, sayfalı.
        `meta.pagination` {page,pageSize,totalItems,totalPages} —
        ApiResponse::paginated zarfı (Meta.pagination offset/limit varyantı
        DEĞİL — bkz. BillingPagination). Aralık dışı/bozuk `page`/`pageSize`
        422 VALIDATION_ERROR + error.fields döndürür; tip dışı değer gateway'de
        (route `type:int`) 422 olur. Boş listede `data: []` döner.
      operationId: billingInvoices
      parameters:
        - name: page
          in: query
          required: false
          description: Sayfa numarası (≥1; varsayılan 1)
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Sayfa boyutu (1-100; varsayılan 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Invoices page (boş listede data: [])
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoicesResponse'
        '401':
          description: Unauthorized (auth'sız istek)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'NOT_FOUND — bilinmeyen action'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR — page/pageSize tip dışı (gateway) veya aralık dışı (controller) + error.fields'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen:
        handler: BillingController::invoices